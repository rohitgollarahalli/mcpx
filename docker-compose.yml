# One-command demo: a mock MCP server behind the mcpx gateway.
#
#   docker compose up --build
#   curl -s localhost:8080/mcp/demo -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | jq
#
# You should see only `echo` and `read_file` — `dangerous_delete` is filtered
# out by the policy in examples/demo.docker.yaml.

services:
  mock:
    image: golang:1.22-alpine
    working_dir: /app
    volumes:
      - .:/app
    command: ["go", "run", "./examples/mock-mcp"]

  mcpx:
    build: .
    depends_on:
      - mock
    ports:
      - "8080:8080"
    volumes:
      - ./examples/demo.docker.yaml:/etc/mcpx/demo.yaml:ro
    command: ["-c", "/etc/mcpx/demo.yaml"]

  # --- Optional observability stack -------------------------------------
  # Prometheus + Grafana with the mcpx dashboard pre-loaded:
  #
  #   docker compose --profile observability up --build
  #   open http://localhost:3000   (anonymous viewer access, admin/admin to edit)

  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: ["observability"]
    depends_on:
      - mcpx
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.1.0
    profiles: ["observability"]
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/mcpx.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
